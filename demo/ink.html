<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>深挖 · 纸墨版</title>
<style>
:root{--bg:#f3f6fa;--card:#ffffff;--ink:#2c3644;--mut:#8b95a5;--line:#e2e8f0;--acc:#5b8ab0;--acc-soft:rgba(91,138,176,.12);--acc-faint:rgba(91,138,176,.06)}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;color:var(--ink);height:100vh;display:flex;background:linear-gradient(180deg,#f7fafc 0%,var(--bg) 30%)}
#side{width:60px;background:transparent;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:12px}
#side button{width:40px;height:40px;border:0;background:none;font-size:19px;border-radius:12px;cursor:pointer;color:var(--mut);transition:all .2s}
#side button:hover{background:#e8eef5;color:var(--ink)}
#side button.on{background:var(--acc-soft);color:var(--acc)}
#clist{width:236px;flex:none;display:flex;flex-direction:column;padding:20px 12px;gap:6px;overflow-y:auto}
#newChat{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);box-shadow:0 2px 10px rgba(91,138,176,.08);transition:all .2s}
#newChat:hover{border-color:var(--acc);color:var(--acc)}
#roots{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.ritem{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s}
.ritem:hover{background:#e9eff6}
.ritem.on{background:var(--card);box-shadow:0 2px 12px rgba(91,138,176,.12);font-weight:600}
.ritem small{display:block;font-size:11px;opacity:.55;margin-top:3px;font-weight:400}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;padding:16px 24px 0;align-items:flex-end;overflow-x:auto}
.tab{position:relative;padding:8px 30px 10px 14px;border:0;background:none;font-size:13.5px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-family:inherit;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tab .x{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mut);border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:13px}
.tab:hover .x{display:block}
.tab .x:hover{background:#dde5ee;color:var(--ink)}
#views{flex:1;display:flex;min-height:0}
#tree{width:0;overflow:hidden;transition:width .2s}
#tree.open{width:250px;border-right:1px solid var(--line)}
#tree .hd{padding:18px 18px 8px;font-size:12px;letter-spacing:3px;color:var(--mut)}
#treeList{padding:4px 12px;font-size:14px}
#tree.open.wide{width:340px}
#tree .hd{display:flex;align-items:center;gap:8px}
#treeTog{margin-left:auto;display:flex;gap:4px}
#treeTog button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--mut);font-family:inherit}
#treeTog button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
#treeGraph{display:block;padding:6px 4px 16px}
#treeGraph text{font-size:12px;fill:var(--ink);font-family:inherit}
#treeGraph .tn{cursor:pointer}
.tnode{padding:9px 11px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .15s}
.tnode:hover{background:#e9eff6}.tnode.on{background:var(--acc-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#backbar{display:none;padding:12px 32px;font-size:13px;color:var(--mut)}
#backbar button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 16px;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 2px 8px rgba(91,138,176,.08)}
#backbar button:hover{border-color:var(--acc);color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:36px 32px;display:flex;flex-direction:column;gap:22px;max-width:700px;width:100%;margin:0 auto}
.msg-u{align-self:flex-end;background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px;padding:11px 20px;max-width:76%;font-size:15px;box-shadow:0 4px 16px rgba(91,138,176,.25);animation:up .35s ease}
.msg-a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:18px 24px;max-width:92%;font-size:15.5px;line-height:2.1;box-shadow:0 6px 28px rgba(91,138,176,.09);animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
mark.hl{background:transparent;border-radius:3px;padding:0 2px;box-shadow:inset 0 -0.62em var(--mk,rgba(91,138,176,.28))}
u.uln{text-underline-offset:4px;text-decoration-thickness:1.5px}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-bottom:10vh}
#empty h1{font-size:26px;font-weight:500;margin:0;letter-spacing:8px;color:var(--ink)}
#empty .sub{color:var(--mut);font-size:13.5px;letter-spacing:3px}
#boxrow{display:flex;gap:0;width:min(580px,86%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 20px;box-shadow:0 8px 32px rgba(91,138,176,.12)}
#q{flex:1;padding:12px 4px;font-size:16px;border:0;background:none;outline:none;font-family:inherit;color:var(--ink)}
#send{padding:10px 26px;font-size:15px;border:0;background:var(--acc);color:#fff;border-radius:12px;cursor:pointer;letter-spacing:2px;font-family:inherit;transition:opacity .15s}
#send:hover{opacity:.88}
#composer{display:flex;gap:0;padding:14px 4px;max-width:700px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
#q2{flex:1;padding:11px 6px;font-size:15px;border:0;background:none;outline:none;font-family:inherit}
#send2{padding:0 10px 0 16px;border:0;background:none;cursor:pointer;color:var(--acc);font-family:inherit;font-size:15px}
#menu{position:fixed;display:none;background:#2c3644;color:#fff;border-radius:12px;padding:5px;font-size:14px;z-index:50;box-shadow:0 14px 36px rgba(44,54,68,.3);font-family:system-ui}
#menu button{background:none;border:0;color:#fff;padding:8px 14px;cursor:pointer;font-size:14px;border-radius:8px}
#menu button:hover{background:#3d4a5c}
#drawer{display:none;position:fixed;top:0;right:0;width:330px;height:100vh;background:var(--card);border-left:1px solid var(--line);padding:28px;z-index:60;box-shadow:-16px 0 40px rgba(91,138,176,.12)}
#drawer.open{display:block}
#drawer h3{margin:0 0 4px;letter-spacing:3px;font-weight:600}
#drawer label{display:block;margin:16px 0 6px;font-size:12px;color:var(--mut);letter-spacing:2px}
#drawer input,#drawer select{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-family:inherit}
#drawer .row{display:flex;gap:8px;margin-top:20px}
#drawer .row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit}
#drawer .row button.pri{background:var(--acc);color:#fff;border:0}
#drawMsg{font-size:12px;color:var(--mut);margin-top:10px;min-height:18px}
#notes{flex:1;overflow-y:auto;padding:28px;display:none;flex-direction:column;gap:18px;max-width:600px;width:100%;margin:0 auto}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;font-size:15px;line-height:2;box-shadow:0 6px 24px rgba(91,138,176,.08)}
.ncard hr{border:0;border-top:1px solid var(--acc);opacity:.45;margin:12px 0}
.ncard .meta{color:var(--mut);font-size:12px;margin-top:10px;letter-spacing:1px}
.ncard .meta a{color:var(--acc);cursor:pointer;text-decoration:none}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2c3644;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;display:none;letter-spacing:1px}
</style></head><body>
<div id="side">
<button data-m="chat" class="on" title="聊天">💬</button>
<button data-m="note" title="笔记">📝</button>
<button data-m="tree" title="树">🌳</button>
<button id="setBtn" title="设置">⚙</button>
</div>
<div id="clist">
<button id="newChat">＋ 新对话</button>
<div id="roots"></div>
</div>
<div id="main">
<div id="tabs"></div>
<div id="views">
<div id="tree"><div class="hd">树<span id="treeTog"><button data-v="graph" class="on">导图</button><button data-v="list">大纲</button></span></div><div id="treeList"></div><svg id="treeGraph" style="display:none"></svg></div>
<div id="chat">
<div id="backbar"><button id="backBtn">← 返回上一级</button> <span id="crumb"></span></div>
<div id="msgs"></div>
<div id="empty"><h1>深 挖</h1><div class="sub">从一个难题开始 · 沿着分支想透</div><div id="boxrow"><input id="q" placeholder="比如：怎么选咖啡豆？"><button id="send">发送</button></div></div>
<div id="composer" style="display:none"><input id="q2" placeholder="继续问…" style="flex:1;padding:11px 13px;font-size:15px;border:1px solid #ccc;border-radius:10px"><button id="send2" style="padding:0 22px;border-radius:10px;border:0;background:#222;color:#fff;cursor:pointer">发送</button></div>
</div>
<div id="notes"></div>
</div></div>
<div id="drawer">
<h3>设置</h3><div style="font-size:12px;color:var(--mut)">模型接入 · 密钥只存本机</div>
<label>服务商</label><select id="sProv"></select>
<label>地址 BASE URL</label><input id="sBase" placeholder="https://…">
<label>模型</label><input id="sModel" placeholder="qwen-plus">
<label>密钥 API KEY（留空=不改）</label><input id="sKey" type="password" placeholder="sk-…">
<div class="row"><button id="sSave" class="pri">保存</button><button id="sTest">测试连接</button><button id="sClose">关闭</button></div>
<div id="drawMsg"></div>
</div>
<div id="menu"><button data-a="copy">复制</button><button data-a="ul">划线</button><button data-a="note">记笔记</button><button data-a="branch">分支</button></div>
<div id="pal"></div>
<div id="toast"></div>
<script>
const POOL=['#f25555','#3fa7ff','#41c46b','#b678f0','#f5a623','#e06ba8','#22c3b6','#8a9a5b','#ff7a45','#6b7ff0','#c0a030','#30b080','#a030b0','#3080c0','#d03050','#50d030','#906020','#206090','#c09030','#3090c0','#7030a0','#30a070','#a07030','#5070c0','#c05070','#7050c0','#40a0c0','#c040a0','#a0c040','#80c040','#4080c0','#c08040','#9040c0','#40c090','#c09040','#6040c0','#4060c0','#c06040','#a0a030','#30a0a0'];
const ULC=['#f5d90a','#7fd67f','#7fb3f5','#f5a0c0','#c0a0f5','#f5a05a','#5ad6d6','#c9c9c9'];
const used=new Set();let poolIdx=0;
const tabs=[];let cur=null,tabSeq=0,nodesCache=[];
const notes=[];
const FAKE='选咖啡豆看三样：产地、烘焙、新鲜度。新手闭眼入这三款：A咖啡豆（埃塞耶加雪菲，花香果酸，适合手冲）；B咖啡豆（巴西喜拉多，坚果巧克力，适合意式）；C咖啡豆（云南普洱，均衡便宜，口粮之王）。先买小包装试，再定口粮。';
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
function nextColor(){while(used.has(POOL[poolIdx%POOL.length]))poolIdx++;const c=POOL[poolIdx%POOL.length];poolIdx++;used.add(c);return c}
function renderTabs(){const bar=document.getElementById('tabs');bar.innerHTML='';
 tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t===cur?' on':'');
  const nm=document.createElement('span');nm.textContent=t.name;d.appendChild(nm);
  const x=document.createElement('span');x.className='x';x.textContent='×';x.title='关闭';
  x.onclick=(e)=>{e.stopPropagation();closeTab(t)};d.appendChild(x);
  d.title=t.name;d.onclick=()=>{switchTab(t)};
  d.oncontextmenu=(e)=>{e.preventDefault();startRename(d,t)};
  d.onauxclick=(e)=>{if(e.button===1){closeTab(t)}};bar.appendChild(d)})}
function closeTab(t){const i=tabs.indexOf(t);if(i<0)return;tabs.splice(i,1);
 if(!tabs.length){cur=null;renderTabs();renderMsgs();renderTree();refreshRoots();return}
 cur=tabs[Math.max(0,i-1)];switchTab(cur)}
function switchTabMsgs(t){if(t.msgs===null){fetch('/api/nodes/'+t.nodeId+'/messages').then(r=>r.json()).then(d=>{
   t.msgs=(d.messages||[]).map(m=>({role:m.role==='user'?'u':'a',text:m.content}));renderMsgs()}).catch(()=>{t.msgs=[];renderMsgs()});return}
 renderMsgs()}
function openNode(n){const ensure=(x)=>{let t=tabs.find(y=>y.nodeId===x.id);
 if(!t){t={id:++tabSeq,nodeId:x.id,name:x.title,parent:null,color:x.color,msgs:null};tabs.push(t)}
 return t};
 const t=ensure(n);
 if(n.parent_id){const p=nodesCache.find(x=>x.id===n.parent_id);
  if(p)t.parent={tab:ensure(p)}}
 switchTab(t)}
let treeMode='graph';
function treeKids(){const kids={};nodesCache.forEach(n=>{const k=n.parent_id||'';(kids[k]=kids[k]||[]).push(n)});return kids}
function renderTree(){
 document.querySelectorAll('#treeTog button').forEach(b=>b.classList.toggle('on',b.dataset.v===treeMode));
 document.getElementById('tree').classList.toggle('wide',treeMode==='graph');
 document.getElementById('treeList').style.display=treeMode==='list'?'block':'none';
 document.getElementById('treeGraph').style.display=treeMode==='graph'?'block':'none';
 if(treeMode==='list')renderTreeList();else renderTreeGraph()}
function renderTreeList(){const L=document.getElementById('treeList');L.innerHTML='';
 if(!nodesCache.length){const e=document.createElement('div');e.style.cssText='padding:8px 11px;font-size:13px;color:var(--mut)';e.textContent='还没有对话';L.appendChild(e);return}
 const kids=treeKids();
 const walk=(pid,depth)=>{(kids[pid]||[]).forEach(n=>{
   const d=document.createElement('div');d.className='tnode'+(cur&&cur.nodeId===n.id?' on':'');
   d.style.paddingLeft=(11+depth*16)+'px';
   d.innerHTML='<span class="dot"></span><span></span>';
   d.firstChild.style.background=n.color||'#c9d3e0';d.lastChild.textContent=n.title;
   d.onclick=()=>openNode(n);L.appendChild(d);walk(n.id,depth+1)})};
 walk('',0)}
function renderTreeGraph(){const NS='http://www.w3.org/2000/svg';const svg=document.getElementById('treeGraph');svg.innerHTML='';
 if(!nodesCache.length){const t=document.createElementNS(NS,'text');t.setAttribute('x',14);t.setAttribute('y',26);t.setAttribute('fill','#8b95a5');t.textContent='还没有对话';svg.appendChild(t);svg.setAttribute('height',40);return}
 const kids=treeKids();const order=[];
 const walk=(pid,depth)=>{(kids[pid]||[]).forEach(n=>{order.push({n,depth});walk(n.id,depth+1)})};walk('',0);
 const RH=34,W=104,BW=96;
 const maxD=order.reduce((a,o)=>Math.max(a,o.depth),0);
 const H=order.length*RH+16,Wd=maxD*W+BW+28;
 svg.setAttribute('width',Wd);svg.setAttribute('height',H);
 const pos={};order.forEach((o,i)=>pos[o.n.id]={x:14+o.depth*W,y:i*RH+24});
 order.forEach(o=>{if(!o.n.parent_id||!pos[o.n.parent_id])return;
  const p=pos[o.n.parent_id],c=pos[o.n.id];const x1=p.x+BW,mx=(x1+c.x)/2;
  const pa=document.createElementNS(NS,'path');
  pa.setAttribute('d','M '+x1+' '+p.y+' H '+mx+' V '+c.y+' H '+c.x);
  pa.setAttribute('fill','none');pa.setAttribute('stroke','#b9c7d8');pa.setAttribute('stroke-width','1.5');
  svg.appendChild(pa)});
 order.forEach(o=>{const c=pos[o.n.id];const on=cur&&cur.nodeId===o.n.id;
  const g=document.createElementNS(NS,'g');g.setAttribute('class','tn');
  const rc=document.createElementNS(NS,'rect');
  rc.setAttribute('x',c.x);rc.setAttribute('y',c.y-12);rc.setAttribute('width',BW);rc.setAttribute('height',24);rc.setAttribute('rx',8);
  rc.setAttribute('fill',on?'#e3edf5':'#ffffff');rc.setAttribute('stroke',on?'#5b8ab0':(o.n.color||'#c9d3e0'));rc.setAttribute('stroke-width',on?'2':'1.2');
  g.appendChild(rc);
  const dt=document.createElementNS(NS,'circle');dt.setAttribute('cx',c.x+11);dt.setAttribute('cy',c.y);dt.setAttribute('r',4);
  dt.setAttribute('fill',o.n.color||'#c9d3e0');g.appendChild(dt);
  const tx=document.createElementNS(NS,'text');tx.setAttribute('x',c.x+20);tx.setAttribute('y',c.y+4);
  tx.textContent=o.n.title.length>7?o.n.title.slice(0,7)+'…':o.n.title;
  const ti=document.createElementNS(NS,'title');ti.textContent=o.n.title;tx.appendChild(ti);g.appendChild(tx);
  g.addEventListener('click',()=>openNode(o.n));svg.appendChild(g)})}
function startRename(d,t){if(d.querySelector('input'))return;
 const inp=document.createElement('input');inp.value=t.name;
 inp.style.cssText='width:110px;font:inherit;background:#fff;border:1px solid var(--acc);border-radius:4px;padding:1px 4px';
 d.innerHTML='';d.appendChild(inp);inp.focus();inp.select();
 let done=false;const commit=(ok)=>{if(done)return;done=true;
  if(ok&&inp.value.trim())renameTab(t,inp.value.trim());else{renderTabs();renderTree()}};
 inp.onkeydown=(e)=>{if(e.key==='Enter')commit(true);else if(e.key==='Escape')commit(false);e.stopPropagation()};
 inp.onblur=()=>commit(true);inp.onclick=(e)=>e.stopPropagation()}
async function renameTab(t,name){t.userNamed=true;if(!t.nodeId){t.name=name;renderTabs();renderTree();return}
 try{const r=await fetch('/api/nodes/'+t.nodeId+'/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:name})});
  if(!r.ok)throw new Error((await r.text()).slice(0,120));t.name=name;renderTabs();renderTree()}
 catch(e){toast('改名失败：'+e.message)}}
function switchTab(t){cur=t;renderTabs();renderTree();refreshRoots();switchTabMsgs(t)}
function refreshRoots(){fetch('/api/nodes').then(r=>r.json()).then(d=>{nodesCache=d.nodes||[];renderRoots(nodesCache);renderTree()}).catch(()=>{})}
function fmtTime(ms){const d=new Date(ms);const p=n=>String(n).padStart(2,'0');return (d.getMonth()+1)+'-'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function curRootId(){if(!cur||!cur.nodeId)return null;const byId={};nodesCache.forEach(n=>byId[n.id]=n);
 let id=cur.nodeId,guard=0;while(byId[id]&&byId[id].parent_id&&guard++<50)id=byId[id].parent_id;return id}
function renderRoots(all){const R=document.getElementById('roots');R.innerHTML='';
 const rid=curRootId();
 (all||[]).filter(n=>!n.parent_id).forEach(n=>{
  const open=tabs.find(t=>t.nodeId===n.id);
  const d=document.createElement('div');d.className='ritem'+(n.id===rid?' on':'');
  d.title=n.title;
  const t=document.createElement('div');t.textContent=n.title;d.appendChild(t);
  const s=document.createElement('small');s.textContent=fmtTime(n.created_at);d.appendChild(s);
  d.onclick=()=>{
   if(open){switchTab(open);return}
   const t={id:++tabSeq,nodeId:n.id,name:n.title,parent:null,color:n.color,msgs:null};
   tabs.push(t);switchTab(t)};
  R.appendChild(d)})}
function renderMsgs(){const M=document.getElementById('msgs');M.innerHTML='';
 const bb=document.getElementById('backbar');
 const started=cur&&cur.msgs&&cur.msgs.length>0;
 document.getElementById('empty').style.display=started?'none':'flex';
 document.getElementById('composer').style.display=started?'flex':'none';
 if(!cur){bb.style.display='none';return}
 if(!cur.msgs){bb.style.display='none';M.innerHTML='<div class="msg-a">…</div>';switchTabMsgs(cur);return}
 if(cur.parent){bb.style.display='block';document.getElementById('crumb').textContent='上级：'+(cur.parent.tab?cur.parent.tab.name:'')}
 else bb.style.display='none';
 cur.msgs.forEach(m=>M.appendChild(bubble(m)));
 M.scrollTop=M.scrollHeight}
function bubble(m){const d=document.createElement('div');d.className=m.role==='u'?'msg-u':'msg-a';
 if(m.html)d.innerHTML=m.html;else if(m.role==='a')d.innerHTML=md(m.text);else d.textContent=m.text;return d}
function md(s){s=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const code=[];s=s.replace(/```(\w*)\n([\s\S]*?)(```|$)/g,(m,l,c)=>{code.push('<pre style="background:#f0ebe0;border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:13px">'+c.replace(/\n$/,'')+'</pre>');return '\u0000'+(code.length-1)+'\u0000'});
 const rows=s.split('\n');let h='',list=null;
 const flush=()=>{if(list){h+='<ul style="margin:6px 0;padding-left:22px">'+list+'</ul>';list=null}};
 rows.forEach(r=>{let t=r.replace(/\s+$/,'');
  const hm=t.match(/^(#{1,4})\s+(.*)$/);
  if(hm){flush();h+='<div style="font-weight:700;margin:10px 0 4px;font-size:'+(17-(hm[1].length))+ 'px">'+inline(hm[2])+'</div>';return}
  const lm=t.match(/^(\s*[-*]|\s*\d+[.)])\s+(.*)$/);
  if(lm){list=(list||'')+'<li>'+inline(lm[2])+'</li>';return}
  flush();if(t==='')return;h+='<div style="margin:4px 0">'+inline(t)+'</div>'});
 flush();
 h=h.replace(/\u0000(\d+)\u0000/g,(m,i)=>code[+i]);
 return h}
function inline(s){return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:#f0ebe0;border-radius:4px;padding:0 4px">$1</code>')}
function streamInto(el,full,done){let i=0;el.textContent='';
 (function tick(){i+=2;el.textContent=full.slice(0,i);
  el.parentNode.scrollTop=el.parentNode.scrollHeight;
  if(i<full.length)setTimeout(tick,12);else done&&done()})()}
async function send(text){text=(text||'').trim();if(!text)return;
 if(!cur){cur={id:++tabSeq,nodeId:null,name:'未命名',parent:null,color:null,msgs:[]};tabs.push(cur);renderTabs()}
 const first=cur.msgs.length===0;
 cur.msgs.push({role:'u',text});renderMsgs();
 const M=document.getElementById('msgs');
 const ab=document.createElement('div');ab.className='msg-a';ab.textContent='…';M.appendChild(ab);
 M.scrollTop=M.scrollHeight;
 let resp;
 try{resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,nodeId:cur.nodeId})})}
 catch(_){ab.textContent='（连不上后端：确认已启动 python -m uvicorn server.main:app --port 8787）';return}
 if(!resp.ok){ab.textContent='（'+resp.status+'）'+(await resp.text()).slice(0,200);return}
 const rd=resp.body.getReader(),dec=new TextDecoder();let buf='',full='',doneId=null;
 try{
 for(;;){const r=await rd.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});
  const parts=buf.split('\n\n');buf=parts.pop();
  for(const p of parts){const m=p.match(/^event: (\w+)\ndata: ([\s\S]*)$/);if(!m)continue;
   let d;try{d=JSON.parse(m[2])}catch(_){continue}
   if(m[1]==='delta'){full+=d.text;ab.innerHTML=md(full);M.scrollTop=M.scrollHeight}
   else if(m[1]==='done'){doneId=d.nodeId}}}
 }catch(e){ab.textContent='（读取中断：'+e.message+'，本轮已落库，切出去再回来可看）';
  cur.msgs.push({role:'a',text:ab.textContent});renderTree();refreshRoots();return}
 if(doneId)cur.nodeId=doneId;
 if(!full){full=ab.textContent&&ab.textContent!=='…'?ab.textContent:'（空回复：模型什么都没返回）';ab.innerHTML=md(full)}
 cur.msgs.push({role:'a',text:full});
 if(first){cur.name=text.length>12?text.slice(0,12)+'…':text;renderTabs();
  fetch('/api/nodes/'+cur.nodeId+'/suggest-title',{method:'POST'}).then(r=>r.json()).then(d=>{
   if(d&&d.title&&!cur.userNamed){cur.name=d.title;renderTabs();renderTree();refreshRoots()}}).catch(()=>{})}
 renderTree();refreshRoots()}
function selInfo(){const s=getSelection();if(!s||s.isCollapsed||s.rangeCount===0)return null;
 const r=s.getRangeAt(0);const box=document.getElementById('msgs');
 if(!box.contains(r.commonAncestorContainer))return null;return{range:r,text:s.toString()}}
document.addEventListener('mouseup',e=>{
 if(e.target.closest('#menu'))return;
 const info=selInfo();const menu=document.getElementById('menu');
 if(!info||!info.text.trim()){menu.style.display='none';return}
 menu.style.display='block';
 menu.style.left=Math.min(e.clientX,innerWidth-260)+'px';menu.style.top=(e.clientY+8)+'px';
 menu._info=info});
document.getElementById('menu').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const info=document.getElementById('menu')._info;
 document.getElementById('menu').style.display='none';if(!info)return;
 const act=b.dataset.a;textAct(act,info);getSelection().removeAllRanges()});
async function textAct(act,info){
 const txt=info.text;
 if(act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(txt);toast('已复制')}
 else if(act==='ul'){wrapRange(info.range,'u',{color:ULC[0],ul:true});cur.msgs=readBack();toast('已划线（原型：默认黄）')}
 else if(act==='note'){addNote(txt);toast('已记入笔记本')}
 else if(act==='branch'){
  if(!cur||!cur.nodeId){toast('等第一轮落库后再分');return}
  const c=nextColor();let node;
  try{const r=await fetch('/api/branch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({parentId:cur.nodeId,anchorText:txt.slice(0,200),color:c})});
   if(!r.ok)throw new Error((await r.text()).slice(0,120));node=(await r.json()).node}
  catch(e){toast('分支失败：'+e.message);return}
  try{wrapRange(info.range,'mark',{color:c})}catch(_){}
  cur.msgs=readBack();
  const nt={id:++tabSeq,nodeId:node.id,name:txt.slice(0,12)+(txt.length>12?'…':''),parent:{tab:cur},color:c,msgs:[]};
  tabs.push(nt);switchTab(nt);refreshRoots();
  fetch('/api/nodes/'+node.id+'/suggest-title',{method:'POST'}).then(r=>r.json()).then(d=>{
   if(d&&d.title&&!nt.userNamed){nt.name=d.title;renderTabs();renderTree();refreshRoots()}}).catch(()=>{});
  toast('已分支出去')}}
function wrapRange(range,tag,opt){const el=document.createElement(tag==='mark'?'mark':'u');
 if(tag==='mark'){el.className='hl';el.style.setProperty('--mk',opt.color+'55')}
 else{el.className='uln';el.style.textDecorationColor=opt.color}
 try{range.surroundContents(el)}catch(_){toast('跨段选取原型不支持，选一段内的文字')}}
function readBack(){const M=document.getElementById('msgs');const out=[];
 [...M.children].forEach(d=>{if(d.className==='msg-u')out.push({role:'u',text:d.textContent});
  else if(d.className==='msg-a')out.push({role:'a',html:d.innerHTML,text:d.textContent})});return out}
function addNote(txt){notes.unshift({text:txt,time:new Date().toLocaleString('zh-CN',{hour12:false}),from:cur?cur.name:'?',color:cur&&cur.color?cur.color:'#888'});
 if(document.querySelector('#side button[data-m=note]').classList.contains('on'))renderNotes()}
function renderNotes(){const N=document.getElementById('notes');N.innerHTML='';
 const b=document.createElement('button');b.textContent='随便看看';b.style.cssText='align-self:flex-end;border:1px solid #ccc;background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer';
 b.onclick=()=>{if(!notes.length){toast('笔记本还是空的');return}
  const n=notes[Math.floor(Math.random()*notes.length)];N.prepend(card(n));toast('随机回顾')};
 N.appendChild(b);
 notes.forEach(n=>N.appendChild(card(n)))}
function card(n){const d=document.createElement('div');d.className='ncard';
 const hr1=document.createElement('hr'),hr2=document.createElement('hr');
 const p=document.createElement('div');p.textContent=n.text;
 const m=document.createElement('div');m.className='meta';
 m.innerHTML='';m.appendChild(document.createTextNode(n.time+' · '));
 const a=document.createElement('a');a.textContent='出自：'+n.from;
 a.onclick=()=>{const t=tabs.find(t=>t.name===n.from);if(t){setModule('chat');switchTab(t)}else toast('原分支已关闭（原型）')};
 m.appendChild(a);d.append(hr1,p,hr2,m);return d}
const panels={chat:true,note:false,tree:false};
function syncPanels(){document.querySelectorAll('#side button[data-m]').forEach(b=>b.classList.toggle('on',!!panels[b.dataset.m]));
 document.getElementById('chat').style.display=panels.chat?'flex':'none';
 document.getElementById('clist').style.display=panels.chat?'flex':'none';
 document.getElementById('notes').style.display=panels.note?'flex':'none';
 document.getElementById('tree').classList.toggle('open',panels.tree);
 if(panels.note)renderNotes();if(panels.tree)renderTree()}
function setModule(m){if(m)panels[m]=true;syncPanels()}
document.querySelectorAll('#side button').forEach(b=>b.onclick=()=>{
 if(!b.dataset.m)return;
 panels[b.dataset.m]=!panels[b.dataset.m];
 const on=Object.values(panels).some(Boolean);
 if(!on)panels[b.dataset.m]=true; /* 至少留一栏，防全关白屏 */
 syncPanels()});
document.querySelectorAll('#treeTog button').forEach(b=>b.onclick=(e)=>{e.stopPropagation();treeMode=b.dataset.v;renderTree()});
document.getElementById('send').onclick=()=>{send(document.getElementById('q').value);document.getElementById('q').value=''};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};
document.getElementById('send2').onclick=()=>{send(document.getElementById('q2').value);document.getElementById('q2').value=''};
document.getElementById('q2').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send2').click()};
document.getElementById('backBtn').onclick=()=>{if(cur&&cur.parent)switchTab(cur.parent.tab)};
document.getElementById('newChat').onclick=()=>{setModule('chat');cur=null;renderTabs();renderMsgs();renderTree();refreshRoots();
 setTimeout(()=>{const q=document.getElementById('q');q&&q.focus()},50)};
document.getElementById('setBtn').onclick=()=>document.getElementById('drawer').classList.add('open');
document.getElementById('sClose').onclick=()=>document.getElementById('drawer').classList.remove('open');
document.getElementById('sSave').onclick=async()=>{
 const b={provider:document.getElementById('sProv').value,baseUrl:document.getElementById('sBase').value,
  model:document.getElementById('sModel').value,apiKey:document.getElementById('sKey').value};
 try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const d=await r.json();document.getElementById('drawMsg').textContent=r.ok?'已保存（'+(d.config.key_masked||'无密钥')+'）':'保存失败';
  document.getElementById('sKey').value=''}catch(e){document.getElementById('drawMsg').textContent='保存失败：'+e.message}};
document.getElementById('sTest').onclick=async()=>{
 document.getElementById('drawMsg').textContent='测试中…';
 try{const r=await fetch('/api/settings/test',{method:'POST'});const d=await r.json();
  document.getElementById('drawMsg').textContent=(d.ok?'✓ ':'✗ ')+d.message}catch(e){document.getElementById('drawMsg').textContent='失败：'+e.message}};
(async function boot(){
 try{const s=await (await fetch('/api/settings')).json();
  const sel=document.getElementById('sProv');sel.innerHTML='';
  Object.entries(s.providers||{}).forEach(([id,p])=>{const o=document.createElement('option');o.value=id;o.textContent=p.name;sel.appendChild(o)});
  sel.value=s.config.provider||'dashscope';
  document.getElementById('sBase').value=s.config.base_url||'';
  document.getElementById('sModel').value=s.config.model||'';
  if(!s.config.configured)toast('未配模型：点⚙设置（不配也能聊，走mock）')}catch(_){toast('连不上后端，确认服务已启动')}
 try{const n=await (await fetch('/api/nodes')).json();
  nodesCache=n.nodes||[];
  const root=nodesCache.find(x=>!x.parent_id)||null;
  if(root){cur={id:++tabSeq,nodeId:root.id,name:root.title,parent:null,color:root.color,msgs:null};tabs.push(cur);renderTabs();switchTab(cur)}
  else{renderTabs();renderTree()}
  refreshRoots()}catch(_){}})();
</script></body></html>
