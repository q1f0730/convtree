<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>深挖 · 纸墨版</title>
<style>
:root{--bg:#f3f6fa;--card:#ffffff;--ink:#2c3644;--mut:#8b95a5;--line:#e2e8f0;--acc:#5b8ab0;--acc-soft:rgba(91,138,176,.12);--acc-faint:rgba(91,138,176,.06)}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;color:var(--ink);height:100vh;display:flex;background:linear-gradient(180deg,#f7fafc 0%,var(--bg) 30%)}
#side{width:60px;background:transparent;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:12px;border-right:1px solid var(--line)}
#side button{width:40px;height:40px;border:0;background:none;font-size:19px;border-radius:12px;cursor:pointer;color:var(--mut);transition:all .2s;display:flex;align-items:center;justify-content:center}
#side button svg{width:21px;height:21px;display:block}
#side button:hover{background:#e8eef5;color:var(--ink)}
#side button.on{background:var(--acc-soft);color:var(--acc)}
#clist{width:236px;flex:none;display:flex;flex-direction:column;padding:20px 12px;gap:6px;overflow-y:auto;border-right:1px solid var(--line);background:rgba(255,255,255,.6)}
#newChat{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);box-shadow:0 2px 10px rgba(91,138,176,.08);transition:all .2s}
#newChat:hover{border-color:var(--acc);color:var(--acc)}
#roots{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.ritem{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s}
.ritem:hover{background:#e9eff6}
.ritem.on{background:var(--card);box-shadow:0 2px 12px rgba(91,138,176,.12);font-weight:600}
.ritem small{display:block;font-size:11px;opacity:.55;margin-top:3px;font-weight:400}
#main{flex:1;display:flex;min-width:0}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#cv{flex:1;display:flex;min-height:0}
#tabs{display:flex;gap:2px;padding:16px 24px 0;align-items:flex-end;overflow-x:auto;overflow-y:hidden}
#tabs::after{content:'';flex:1;border-bottom:2px solid var(--line)}
.tab{position:relative;padding:8px 30px 10px 14px;border:0;background:none;font-size:13.5px;cursor:pointer;color:var(--mut);border-bottom:2px solid var(--line);font-family:inherit;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tab .x{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mut);border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:13px}
.tab:hover .x{display:block}
.tab .x:hover{background:#dde5ee;color:var(--ink)}

#tree{width:0;overflow:hidden;transition:width .2s;position:relative}
#tree.open{width:250px;border-left:1px solid var(--line);background:rgba(255,255,255,.6)}
#tree .hd{padding:18px 18px 8px;font-size:12px;letter-spacing:3px;color:var(--mut)}
#treeList{padding:4px 12px;font-size:14px;overflow:auto;flex:1;min-height:0}
#tree.open.wide{width:340px}
#tree.open{display:flex;flex-direction:column}
#tree .hd{flex:none}
#treeScroll{overflow:auto;flex:1;min-height:0}
#treeScroll.dots{background-image:radial-gradient(circle,#bcc9d9 1px,transparent 1.3px);background-size:22px 22px}
#treeGraph{cursor:grab}
#treeGraph.panning{cursor:grabbing}
#treeZoom{margin-left:6px;display:flex;gap:4px;align-items:center}
#treeZoom button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:2px 8px;cursor:pointer;color:var(--mut);font-family:inherit}
#treeZoom button:hover{color:var(--acc);border-color:var(--acc)}
#treeZoom button[data-z="reset"]{min-width:46px}
#treeResize{position:absolute;top:0;left:-5px;width:11px;height:100%;cursor:ew-resize;z-index:6;display:none}
#treeResize::after{content:'';position:absolute;top:0;bottom:0;left:4px;width:3px;border-radius:2px;background:transparent;transition:background .15s}
#treeResize:hover::after{background:var(--acc)}
.tnode span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tree .hd{display:flex;align-items:center;gap:8px}
#treeScope{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;letter-spacing:0}
#treeTog{margin-left:auto;display:flex;gap:4px}
#treeTog button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:3px 10px;cursor:pointer;color:var(--mut);font-family:inherit}
#treeTog button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
#treeGraph{display:block}
#treeGraph text{font-size:12px;fill:var(--ink);font-family:inherit}
#treeGraph .tn{cursor:pointer}
.tnode{padding:9px 11px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .15s}
.tnode:hover{background:#e9eff6}.tnode.on{background:var(--acc-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#backbar{display:none;padding:12px 32px;font-size:13px;color:var(--mut)}
#backbar button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 16px;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 2px 8px rgba(91,138,176,.08)}
#backbar button:hover{border-color:var(--acc);color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;max-width:700px;width:100%;margin:0 auto}
.msg-u{align-self:flex-end;background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px;padding:10px 16px;max-width:76%;font-size:15px;box-shadow:0 4px 16px rgba(91,138,176,.25);animation:up .35s ease}
.msg-a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:14px 18px;max-width:92%;font-size:15.5px;line-height:2.1;box-shadow:0 6px 28px rgba(91,138,176,.09);animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.thinking{display:inline-flex;gap:7px;align-items:center;padding:8px 2px}
.thinking span{width:8px;height:8px;border-radius:50%;background:var(--acc);opacity:.35;animation:think 1.2s infinite ease-in-out}
.thinking span:nth-child(2){animation-delay:.15s}
.thinking span:nth-child(3){animation-delay:.3s}
@keyframes think{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-7px);opacity:1}}
.msg-a.is-thinking{animation:breathe 2.4s infinite ease-in-out}
@keyframes breathe{0%,100%{box-shadow:0 6px 28px rgba(91,138,176,.09)}50%{box-shadow:0 6px 34px rgba(91,138,176,.22)}}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--acc);vertical-align:text-bottom;margin-left:3px;border-radius:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
*{scrollbar-width:thin;scrollbar-color:#c3cfdd transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background-color:#c3cfdd;border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background-color:#9db4c9;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
#fmtmenu{position:fixed;display:none;background:#2c3644;color:#fff;border-radius:12px;padding:10px;font-size:14px;z-index:70;box-shadow:0 14px 36px rgba(44,54,68,.3);font-family:system-ui;min-width:220px}
#fmtmenu .frow{display:flex;gap:6px;align-items:center}
#fmtmenu button{background:none;border:1px solid #55606f;color:#fff;padding:6px 12px;cursor:pointer;font-size:14px;border-radius:8px;font-family:inherit}
#fmtmenu button:hover{background:#3d4a5c}
#fmtmenu button.on{background:#5b8ab0;border-color:#5b8ab0}
#fmtmenu button.b{font-weight:700}
#fmtmenu button.i{font-style:italic}
#fmtmenu button.go{background:#5b8ab0;border:0}
#fmtmenu button.ghost{border:0;color:#9aa5b5}
mark.hl{background:transparent;border-radius:3px;padding:0 2px;box-shadow:inset 0 -0.62em var(--mk,rgba(91,138,176,.28))}
mark.hl[data-ref]{cursor:pointer}
mark.hl[data-ref]:hover{filter:brightness(.96)}
u.uln{text-underline-offset:4px;text-decoration-thickness:1.5px}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-bottom:10vh}
#empty h1{font-size:26px;font-weight:500;margin:0;letter-spacing:8px;color:var(--ink)}
#empty .sub{color:var(--mut);font-size:13.5px;letter-spacing:3px}
#boxrow{display:flex;gap:0;width:min(580px,86%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 20px;box-shadow:0 8px 32px rgba(91,138,176,.12)}
#q{flex:1;padding:12px 4px;font-size:16px;border:0;background:none;outline:none;font-family:inherit;color:var(--ink)}
#send{padding:10px 26px;font-size:15px;border:0;background:var(--acc);color:#fff;border-radius:12px;cursor:pointer;letter-spacing:2px;font-family:inherit;transition:opacity .15s}
#send:hover{opacity:.88}
#composer{display:flex;gap:0;padding:14px 4px;max-width:700px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
#q2{flex:1;padding:11px 6px;font-size:15px;border:0;background:none;outline:none;font-family:inherit}
#send2{padding:0 10px 0 16px;border:0;background:none;cursor:pointer;color:var(--acc);font-family:inherit;font-size:15px}
#menu{position:fixed;display:none;background:#2c3644;color:#fff;border-radius:12px;padding:5px;font-size:14px;z-index:50;box-shadow:0 14px 36px rgba(44,54,68,.3);font-family:system-ui}
#menu button{background:none;border:0;color:#fff;padding:8px 14px;cursor:pointer;font-size:14px;border-radius:8px}
#menu button:hover{background:#3d4a5c}
#drawer{display:none;position:fixed;inset:0;z-index:60;background:rgba(44,54,68,.38);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px}
#drawer.open{display:flex}
#drawer .sheet{background:var(--card);border-radius:20px;padding:36px 40px;width:min(560px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(44,54,68,.35);animation:up .3s ease}
#drawer h3{margin:0 0 4px;letter-spacing:4px;font-weight:600;font-size:19px}
#drawer label{display:block;margin:16px 0 6px;font-size:12px;color:var(--mut);letter-spacing:2px}
#drawer input,#drawer select{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-family:inherit}
#drawer .row{display:flex;gap:8px;margin-top:20px}
#drawer .row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit}
#drawer .row button.pri{background:var(--acc);color:#fff;border:0}
#drawMsg{font-size:12px;color:var(--mut);margin-top:10px;min-height:18px}
#buildTag{font-size:12px;color:var(--mut);margin-top:14px;text-align:center;opacity:.8}
#notes{flex:1;overflow-y:auto;padding:28px;display:none;flex-direction:column;gap:18px;max-width:600px;width:100%;margin:0 auto}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;font-size:15px;line-height:2;box-shadow:0 6px 24px rgba(91,138,176,.08)}
.ncard hr{border:0;border-top:1px solid var(--acc);opacity:.45;margin:12px 0}
.ncard .meta{color:var(--mut);font-size:12px;margin-top:10px;letter-spacing:1px}
.ncard .meta a{color:var(--acc);cursor:pointer;text-decoration:none}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2c3644;color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;display:none;letter-spacing:1px}
#treemenu{position:fixed;display:none;background:#2c3644;color:#fff;border-radius:12px;padding:5px;font-size:14px;z-index:70;box-shadow:0 14px 36px rgba(44,54,68,.3);min-width:200px;font-family:system-ui}
#treemenu button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:8px 14px;cursor:pointer;font-size:14px;border-radius:8px;font-family:inherit}
#treemenu button:hover{background:#3d4a5c}
#treemenu button.danger{color:#ffb3b3}
#treemenu .cf{padding:8px 14px;font-size:13px}
#treemenu .cf .row{display:flex;gap:8px;margin-top:10px}
#treemenu .cf .row button{border:1px solid #55606f;text-align:center}
#treemenu .cf .row button.go{background:#b05252;border:0}
.tnode.sel{background:#fdeef4;box-shadow:inset 0 0 0 1.5px #e06ba8}
#batchbar{display:none;gap:10px;align-items:center;padding:8px 18px;font-size:13px;background:#fdf2f6;border-top:1px solid #f3c9d8}
#batchbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 14px;cursor:pointer;font-family:inherit;font-size:13px}
#batchbar button.go{background:#b05252;color:#fff;border:0}
</style></head><body>
<div id="side">
<button data-m="chat" class="on" title="聊天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="11.5" rx="3"/><path d="M9 16v3.8L13.2 16"/></svg></button>

<script>
const POOL=['#f25555','#3fa7ff','#41c46b','#b678f0','#f5a623','#e06ba8','#22c3b6','#8a9a5b','#ff7a45','#6b7ff0','#c0a030','#30b080','#a030b0','#3080c0','#d03050','#50d030','#906020','#206090','#c09030','#3090c0','#7030a0','#30a070','#a07030','#5070c0','#c05070','#7050c0','#40a0c0','#c040a0','#a0c040','#80c040','#4080c0','#c08040','#9040c0','#40c090','#c09040','#6040c0','#4060c0','#c06040','#a0a030','#30a0a0'];
const ULC=['#f5d90a','#7fd67f','#7fb3f5','#f5a0c0','#c0a0f5','#f5a05a','#5ad6d6','#c9c9c9'];
const used=new Set();let poolIdx=0;
const tabs=[];let cur=null,tabSeq=0,nodesCache=[];
const notes=[];
const FAKE='选咖啡豆看三样：产地、烘焙、新鲜度。新手闭眼入这三款：A咖啡豆（埃塞耶加雪菲，花香果酸，适合手冲）；B咖啡豆（巴西喜拉多，坚果巧克力，适合意式）；C咖啡豆（云南普洱，均衡便宜，口粮之王）。先买小包装试，再定口粮。';
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
function nextColor(){while(used.has(POOL[poolIdx%POOL.length]))poolIdx++;const c=POOL[poolIdx%POOL.length];poolIdx++;used.add(c);return c}
function renderTabs(){const bar=document.getElementById('tabs');bar.innerHTML='';
 tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t===cur?' on':'');
  const nm=document.createElement('span');nm.textContent=t.name;d.appendChild(nm);
  const x=document.createElement('span');x.className='x';x.textContent='×';x.title='关闭';
  x.onclick=(e)=>{e.stopPropagation();closeTab(t)};d.appendChild(x);
  d.title=t.name;d.onclick=()=>{switchTab(t)};
  d.oncontextmenu=(e)=>{e.preventDefault();startRename(d,t)};
  d.onauxclick=(e)=>{if(e.button===1){closeTab(t)}};bar.appendChild(d)})}
function closeTab(t){const i=tabs.indexOf(t);if(i<0)return;tabs.splice(i,1);
 if(!tabs.length){cur=null;renderTabs();renderMsgs();renderTree();refreshRoots();return}
 cur=tabs[Math.max(0,i-1)];switchTab(cur)}
function switchTabMsgs(t){if(t.msgs===null){fetchMsgs(t.nodeId).then(ms=>{if(!tabs.includes(t))return;t.msgs=ms;renderMsgs()}).catch(()=>{if(tabs.includes(t)){t.msgs=[];renderMsgs()}});return}
 renderMsgs()}
function openNode(n){if(!n)return;const ensure=(x)=>{let t=tabs.find(y=>y.nodeId===x.id);
 if(!t){t={id:++tabSeq,nodeId:x.id,name:x.title,parent:null,color:x.color,msgs:null};tabs.push(t)}
 return t};
 const t=ensure(n);
 if(n.parent_id){const p=nodesCache.find(x=>x.id===n.parent_id);
  if(p)t.parent={tab:ensure(p)}}
 switchTab(t)}
let treeMode='graph';
let treeZoom=1,suppressClick=false;

let treeWUser=null;
function treeW(){return treeWUser!=null?treeWUser:(treeMode==='graph'?340:250)}
function treeMaxW(){return Math.max(180,window.innerWidth-60-236-480)}
function syncTreeWidth(){const t=document.getElementById('tree'),h=document.getElementById('treeResize');
 if(!panels.tree){t.style.width='';h.style.display='none';return}
 t.style.width=Math.min(treeW(),treeMaxW())+'px';h.style.display='block'}
const _mc=document.createElement('canvas').getContext('2d');_mc.font='12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
const NODE_W=120,NODE_H=90;
function treeLines(title,maxW){const s=String(title==null?'':title);
 const fits=t=>{try{return _mc.measureText(t).width<=maxW}catch(_){return t.length*12<=maxW}};
 let i=0,l1='',l2='';
 while(i<s.length&&fits(l1+s[i]))l1+=s[i++];
 while(i<s.length&&fits(l2+s[i]))l2+=s[i++];
 if(i>=s.length)return l2?[l1,l2]:[l1];

 const tops=topsOf(ids).filter(id=>nodesCache.find(n=>n.id===id));
 if(!tops.length){toast('所选已不在树上');return}
 const del=new Set();let fails=0;
 for(const id of tops){try{const r=await fetch('/api/nodes/'+id+'/delete',{method:'POST'});
  if(!r.ok)throw new Error((await r.text()).slice(0,100));
  (await r.json()).deleted.forEach(x=>del.add(x))}catch(e){fails++;toast('删除失败：'+e.message)}}
 if(!del.size)return;
 nodesCache=nodesCache.filter(n=>!del.has(n.id));
 selNodes.clear();syncBatchbar();closeTabsByIds(del);renderTree();refreshRoots();
 toast(fails?('删了 '+del.size+' 个节点，'+fails+' 支失败'):('已删除 '+del.size+' 个节点'))}
function closeTabsByIds(set){let ch=false;for(let i=tabs.length-1;i>=0;i--){if(set.has(tabs[i].nodeId)){tabs.splice(i,1);ch=true}}
 if(!ch)return;
 if(!cur||set.has(cur.nodeId)){cur=tabs.length?tabs[tabs.length-1]:null}
 renderTabs();if(cur)switchTabMsgs(cur);else renderMsgs()}
document.addEventListener('click',e=>{if(!e.target.closest('#treemenu'))hideTreeMenu()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const dr=document.getElementById('drawer');if(dr.classList.contains('open')){dr.classList.remove('open');return}if(selNodes.size){selNodes.clear();syncBatchbar();renderTree()}});
document.getElementById('send').onclick=()=>{send(document.getElementById('q').value);document.getElementById('q').value=''};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};
document.getElementById('send2').onclick=()=>{send(document.getElementById('q2').value);document.getElementById('q2').value=''};
document.getElementById('q2').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send2').click()};
document.getElementById('backBtn').onclick=()=>{if(cur&&cur.parent)switchTab(cur.parent.tab)};
document.getElementById('newChat').onclick=()=>{setModule('chat');tabs.length=0;cur=null;selNodes.clear();syncBatchbar();renderTabs();renderMsgs();renderTree();refreshRoots();toast('已开新对话');
 setTimeout(()=>{const q=document.getElementById('q');q&&q.focus()},50)};
document.getElementById('setBtn').onclick=()=>document.getElementById('drawer').classList.add('open');
document.getElementById('sClose').onclick=()=>document.getElementById('drawer').classList.remove('open');
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')e.target.classList.remove('open')});
document.getElementById('sSave').onclick=async()=>{
 const b={provider:document.getElementById('sProv').value,baseUrl:document.getElementById('sBase').value,
  model:document.getElementById('sModel').value,apiKey:document.getElementById('sKey').value};
 try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const d=await r.json();document.getElementById('drawMsg').textContent=r.ok?'已保存（'+(d.config.key_masked||'无密钥')+'）':'保存失败';
  document.getElementById('sKey').value=''}catch(e){document.getElementById('drawMsg').textContent='保存失败：'+e.message}};
document.getElementById('sTest').onclick=async()=>{
 document.getElementById('drawMsg').textContent='测试中…';
 try{const r=await fetch('/api/settings/test',{method:'POST'});const d=await r.json();
  document.getElementById('drawMsg').textContent=(d.ok?'✓ ':'✗ ')+d.message}catch(e){document.getElementById('drawMsg').textContent='失败：'+e.message}};
(async function boot(){
 try{const s=await (await fetch('/api/settings')).json();
  const sel=document.getElementById('sProv');sel.innerHTML='';
  Object.entries(s.providers||{}).forEach(([id,p])=>{const o=document.createElement('option');o.value=id;o.textContent=p.name;sel.appendChild(o)});
  sel.value=s.config.provider||'dashscope';
  document.getElementById('sBase').value=s.config.base_url||'';
  document.getElementById('sModel').value=s.config.model||'';
  if(!s.config.configured)toast('未配模型：点侧栏设置（不配也能聊，走mock）')}catch(_){toast('连不上后端，确认服务已启动')}
 try{const v=await (await fetch('/api/version')).json();const b=v.build||'dev';document.getElementById('buildTag').textContent='构建 '+b;console.log('[convtree] build '+b)}catch(_){}
 try{const n=await (await fetch('/api/nodes')).json();
  nodesCache=n.nodes||[];
  const root=nodesCache.find(x=>!x.parent_id)||null;
  if(root){cur={id:++tabSeq,nodeId:root.id,name:root.title,parent:null,color:root.color,msgs:null};tabs.push(cur);renderTabs();switchTab(cur)}
  else{renderTabs();renderTree()}
  syncPanels();refreshRoots()}catch(_){}})();
</script></body></html>
