<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>06 · Notion灰</title>
<style>
:root{--line:#e5e5e5;--ink:#222;--mut:#888}
*{box-sizing:border-box}body{font-family:system-ui;margin:0;color:var(--ink);background:#fafafa;height:100vh;display:flex}
#side{width:56px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:4px}
#side button{width:40px;height:40px;border:0;background:none;font-size:20px;border-radius:8px;cursor:pointer}
#side button.on{background:#eef4ff}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;padding:8px 12px 0;background:#fff;border-bottom:1px solid var(--line);align-items:center}
.tab{padding:6px 12px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#f6f6f6;font-size:13px;cursor:pointer;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:#fff;font-weight:600}
#views{flex:1;display:flex;min-height:0}
#tree{width:0;overflow:hidden;border-right:0 solid var(--line);background:#fff;transition:width .15s}
#tree.open{width:240px;border-right:1px solid var(--line)}
#tree .hd{padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line);font-size:14px}
#treeList{padding:8px;font-size:13px}
.tnode{padding:5px 8px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tnode:hover{background:#f3f3f3}.tnode.on{background:#eef4ff}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#backbar{display:none;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:13px}
#backbar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.msg-u{align-self:flex-end;background:#e8f3e8;border-radius:12px;padding:9px 14px;max-width:80%;font-size:15px}
.msg-a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 15px;max-width:88%;font-size:15px;line-height:1.7}
mark.hl{background:transparent;border-radius:3px;padding:0 2px}
u.uln{text-underline-offset:3px}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#empty h1{font-size:20px;font-weight:600;margin:0}
#boxrow{display:flex;gap:8px;width:min(620px,90%)}
#q{flex:1;padding:12px 14px;font-size:15px;border:1px solid #ccc;border-radius:10px}
#send{padding:0 22px;font-size:15px;border-radius:10px;border:0;background:#222;color:#fff;cursor:pointer}
#composer{display:flex;gap:8px;padding:12px;max-width:760px;width:100%;margin:0 auto}
#menu{position:fixed;display:none;background:#222;color:#fff;border-radius:8px;padding:4px;font-size:13px;z-index:50}
#menu button{background:none;border:0;color:#fff;padding:7px 12px;cursor:pointer;font-size:13px}
#menu button:hover{background:#444;border-radius:6px}
#notes{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:12px;max-width:620px;width:100%;margin:0 auto}
.ncard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.ncard hr{border:0;border-top:1px solid #999;margin:8px 0}
.ncard .meta{color:var(--mut);font-size:12px;margin-top:8px}
.ncard .meta a{color:#3fa7ff;cursor:pointer}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;display:none}
#pal{display:none;gap:6px;padding:8px}
#pal span{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}
</style>
<style>
/* 06 · Notion灰 */
body{background:#f1f1ef;font-family:Georgia,serif}#main,#side,#tabs,.msg-a,#tree{background:#f1f1ef!important}.msg-a{border:0!important;box-shadow:0 1px 3px rgba(0,0,0,.12)}.msg-u{background:#e9e9e6!important;box-shadow:0 1px 3px rgba(0,0,0,.12)}.tab{border-radius:4px}.tab,.row{border-radius:4px}#send,#send2{border-radius:4px!important;background:#37352f!important}
</style></head><body>
<div id="side">
<button data-m="chat" class="on" title="聊天">💬</button>
<button data-m="note" title="笔记">📝</button>
<button data-m="tree" title="树">🌳</button>
</div>
<div id="main">
<div id="tabs"></div>
<div id="views">
<div id="tree"><div class="hd">树（点击跳转）</div><div id="treeList"></div></div>
<div id="chat">
<div id="backbar"><button id="backBtn">← 返回上一级</button> <span id="crumb"></span></div>
<div id="msgs"></div>
<div id="empty"><h1>06 · Notion灰 —— 从一个难题开始…</h1><div id="boxrow"><input id="q" placeholder="比如：怎么选咖啡豆？"><button id="send">发送</button></div></div>
<div id="composer" style="display:none"><input id="q2" placeholder="继续问…" style="flex:1;padding:11px 13px;font-size:15px;border:1px solid #ccc;border-radius:10px"><button id="send2" style="padding:0 22px;border-radius:10px;border:0;background:#222;color:#fff;cursor:pointer">发送</button></div>
</div>
<div id="notes"></div>
</div></div>
<div id="menu"><button data-a="copy">复制</button><button data-a="ul">划线</button><button data-a="note">记笔记</button><button data-a="branch">分支</button></div>
<div id="pal"></div>
<div id="toast"></div>
<script>
const POOL=['#f25555','#3fa7ff','#41c46b','#b678f0','#f5a623','#e06ba8','#22c3b6','#8a9a5b','#ff7a45','#6b7ff0','#c0a030','#30b080','#a030b0','#3080c0','#d03050','#50d030','#906020','#206090','#c09030','#3090c0','#7030a0','#30a070','#a07030','#5070c0','#c05070','#7050c0','#40a0c0','#c040a0','#a0c040','#80c040','#4080c0','#c08040','#9040c0','#40c090','#c09040','#6040c0','#4060c0','#c06040','#a0a030','#30a0a0'];
const ULC=['#f5d90a','#7fd67f','#7fb3f5','#f5a0c0','#c0a0f5','#f5a05a','#5ad6d6','#c9c9c9'];
const used=new Set();let poolIdx=0;
const tabs=[];let cur=null,tabSeq=0;
const notes=[];
const FAKE='选咖啡豆看三样：产地、烘焙、新鲜度。新手闭眼入这三款：A咖啡豆（埃塞耶加雪菲，花香果酸，适合手冲）；B咖啡豆（巴西喜拉多，坚果巧克力，适合意式）；C咖啡豆（云南普洱，均衡便宜，口粮之王）。先买小包装试，再定口粮。';
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600)}
function nextColor(){while(used.has(POOL[poolIdx%POOL.length]))poolIdx++;const c=POOL[poolIdx%POOL.length];poolIdx++;used.add(c);return c}
function mkTab(name){const t={id:++tabSeq,name,parent:cur?cur.tab:null,color:null,msgs:[],rootQ:''};tabs.push(t);return t}
function renderTabs(){const bar=document.getElementById('tabs');bar.innerHTML='';
 tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t===cur?' on':'');d.textContent=t.name;
  d.title=t.name;d.onclick=()=>{switchTab(t)};
  d.oncontextmenu=(e)=>{e.preventDefault();const n=prompt('重命名',t.name);if(n&&n.trim()){t.name=n.trim();renderTabs();renderTree()}};
  d.onauxclick=(e)=>{if(e.button===1){closeTab(t)}};bar.appendChild(d)})}
function closeTab(t){const i=tabs.indexOf(t);if(i<0)return;tabs.splice(i,1);
 if(!tabs.length){location.reload();return}cur=tabs[Math.max(0,i-1)];renderTabs();renderMsgs();renderTree()}
function renderTree(){const L=document.getElementById('treeList');L.innerHTML='';
 tabs.forEach(t=>{const d=document.createElement('div');d.className='tnode'+(t===cur?' on':'');
  d.innerHTML=`<span class="dot" style="background:${t.color||'#888'}"></span><span></span>`;
  d.lastChild.textContent=t.name;d.onclick=()=>switchTab(t);L.appendChild(d)})}
function switchTab(t){cur=t;renderTabs();renderMsgs();renderTree()}
function renderMsgs(){const M=document.getElementById('msgs');M.innerHTML='';
 const bb=document.getElementById('backbar');
 if(cur.parent){bb.style.display='block';document.getElementById('crumb').textContent='上级：'+cur.parent.name}
 else bb.style.display='none';
 cur.msgs.forEach(m=>M.appendChild(bubble(m)));
 M.scrollTop=M.scrollHeight;
 const started=cur.msgs.length>0;
 document.getElementById('empty').style.display=started?'none':'flex';
 document.getElementById('composer').style.display=started?'flex':'none'}
function bubble(m){const d=document.createElement('div');d.className=m.role==='u'?'msg-u':'msg-a';
 if(m.html)d.innerHTML=m.html;else d.textContent=m.text;return d}
function streamInto(el,full,done){let i=0;el.textContent='';
 (function tick(){i+=2;el.textContent=full.slice(0,i);
  el.parentNode.scrollTop=el.parentNode.scrollHeight;
  if(i<full.length)setTimeout(tick,12);else done&&done()})()}
function send(text){text=text.trim();if(!text)return;
 if(!cur){cur=mkTab('未命名');renderTabs()}
 const first=cur.msgs.length===0;
 if(first)cur.rootQ=text;
 cur.msgs.push({role:'u',text});renderMsgs();
 const M=document.getElementById('msgs');
 const ab=document.createElement('div');ab.className='msg-a';M.appendChild(ab);
 M.scrollTop=M.scrollHeight;
 streamInto(ab,FAKE,()=>{cur.msgs.push({role:'a',text:FAKE});renderTree();
  if(first){cur.name=text.length>10?text.slice(0,10)+'…':text;renderTabs();renderTree()}})}
function selInfo(){const s=getSelection();if(!s||s.isCollapsed||s.rangeCount===0)return null;
 const r=s.getRangeAt(0);const box=document.getElementById('msgs');
 if(!box.contains(r.commonAncestorContainer))return null;return{range:r,text:s.toString()}}
document.addEventListener('mouseup',e=>{
 if(e.target.closest('#menu'))return;
 const info=selInfo();const menu=document.getElementById('menu');
 if(!info||!info.text.trim()){menu.style.display='none';return}
 menu.style.display='block';
 menu.style.left=Math.min(e.clientX,innerWidth-260)+'px';menu.style.top=(e.clientY+8)+'px';
 menu._info=info});
document.getElementById('menu').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const info=document.getElementById('menu')._info;
 document.getElementById('menu').style.display='none';if(!info)return;
 const act=b.dataset.a;textAct(act,info);getSelection().removeAllRanges()});
function textAct(act,info){
 const txt=info.text;
 if(act==='copy'){navigator.clipboard&&navigator.clipboard.writeText(txt);toast('已复制')}
 else if(act==='ul'){wrapRange(info.range,'u',{color:ULC[0],ul:true});cur.msgs=readBack();toast('已划线（原型：默认黄）')}
 else if(act==='note'){addNote(txt);toast('已记入笔记本')}
 else if(act==='branch'){const c=nextColor();wrapRange(info.range,'mark',{color:c});
  cur.msgs=readBack();
  const nt=mkTab('未命名');nt.parent={tab:cur};nt.color=c;switchTab(nt);toast('已分支出去（'+c+'）')}}
function wrapRange(range,tag,opt){const el=document.createElement(tag==='mark'?'mark':'u');
 if(tag==='mark'){el.className='hl';el.style.background=opt.color}
 else{el.className='uln';el.style.textDecorationColor=opt.color}
 try{range.surroundContents(el)}catch(_){toast('跨段选取原型不支持，选一段内的文字')}}
function readBack(){const M=document.getElementById('msgs');const out=[];
 [...M.children].forEach(d=>{if(d.className==='msg-u')out.push({role:'u',text:d.textContent});
  else if(d.className==='msg-a')out.push({role:'a',html:d.innerHTML,text:d.textContent})});return out}
function addNote(txt){notes.unshift({text:txt,time:new Date().toLocaleString('zh-CN',{hour12:false}),from:cur?cur.name:'?',color:cur&&cur.color?cur.color:'#888'});
 if(document.querySelector('#side button[data-m=note]').classList.contains('on'))renderNotes()}
function renderNotes(){const N=document.getElementById('notes');N.innerHTML='';
 const b=document.createElement('button');b.textContent='随便看看';b.style.cssText='align-self:flex-end;border:1px solid #ccc;background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer';
 b.onclick=()=>{if(!notes.length){toast('笔记本还是空的');return}
  const n=notes[Math.floor(Math.random()*notes.length)];N.prepend(card(n));toast('随机回顾')};
 N.appendChild(b);
 notes.forEach(n=>N.appendChild(card(n)))}
function card(n){const d=document.createElement('div');d.className='ncard';
 const hr1=document.createElement('hr'),hr2=document.createElement('hr');
 const p=document.createElement('div');p.textContent=n.text;
 const m=document.createElement('div');m.className='meta';
 m.innerHTML='';m.appendChild(document.createTextNode(n.time+' · '));
 const a=document.createElement('a');a.textContent='出自：'+n.from;
 a.onclick=()=>{const t=tabs.find(t=>t.name===n.from);if(t){setModule('chat');switchTab(t)}else toast('原分支已关闭（原型）')};
 m.appendChild(a);d.append(hr1,p,hr2,m);return d}
function setModule(m){document.querySelectorAll('#side button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 document.getElementById('chat').style.display=m==='chat'?'flex':'none';
 const N=document.getElementById('notes');N.style.display=m==='note'?'flex':'none';
 document.getElementById('tree').classList.toggle('open',m==='tree');
 if(m==='note')renderNotes();if(m==='tree')renderTree()}
document.querySelectorAll('#side button').forEach(b=>b.onclick=()=>setModule(b.dataset.m));
document.getElementById('send').onclick=()=>{send(document.getElementById('q').value);document.getElementById('q').value=''};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};
document.getElementById('send2').onclick=()=>{send(document.getElementById('q2').value);document.getElementById('q2').value=''};
document.getElementById('q2').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send2').click()};
document.getElementById('backBtn').onclick=()=>{if(cur&&cur.parent)switchTab(cur.parent.tab)};
</script></body></html>
